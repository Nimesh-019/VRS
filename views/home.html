<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental System</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold text-white">
                🚗 Vehicle Rental System
            </h1>

            <a href="/host/add-vehicle"
                class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-semibold">
                + Register Vehicle
            </a>

        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-8">

        <!-- Dashboard Cards -->

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

            <div class="bg-white rounded-xl shadow-lg p-6">

                <h2 class="text-gray-500 font-semibold">
                    Total Vehicles
                </h2>

                <p class="text-4xl font-bold text-blue-700 mt-3">
                    0
                </p>

            </div>

            <div class="bg-white rounded-xl shadow-lg p-6">

                <h2 class="text-gray-500 font-semibold">
                    Available
                </h2>

                <p class="text-4xl font-bold text-green-600 mt-3">
                    0
                </p>

            </div>

            <div class="bg-white rounded-xl shadow-lg p-6">

                <h2 class="text-gray-500 font-semibold">
                    On Rent
                </h2>

                <p class="text-4xl font-bold text-orange-500 mt-3">
                    0
                </p>

            </div>

        </div>

        <!-- Vehicle Table -->

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">

            <div class="bg-blue-700 text-white px-6 py-4">

                <h2 class="text-xl font-semibold">
                    Registered Vehicles
                </h2>

            </div>

            <table class="w-full">

                <thead class="bg-gray-200">

                    <tr>

                        <th class="p-4 text-left">Vehicle No</th>

                        <th class="p-4 text-left">Vehicle</th>

                        <th class="p-4 text-left">Owner</th>

                        <th class="p-4 text-left">Mobile</th>

                        <th class="p-4 text-left">Rent/Day</th>

                        <th class="p-4 text-left">Status</th>

                    </tr>

                </thead>

                <tbody>

                    <tr class="border-b">

                        <td class="p-4">GJ05AB1234</td>

                        <td class="p-4">Activa 6G</td>

                        <td class="p-4">Nimesh</td>

                        <td class="p-4">9876543210</td>

                        <td class="p-4">₹500</td>

                        <td class="p-4">

                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">
                                Available
                            </span>

                        </td>

                    </tr>

                    <tr class="border-b">

                        <td class="p-4">GJ01XY7890</td>

                        <td class="p-4">Swift</td>

                        <td class="p-4">Rahul</td>

                        <td class="p-4">9876549876</td>

                        <td class="p-4">₹1800</td>

                        <td class="p-4">

                            <span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full">
                                Rented
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
